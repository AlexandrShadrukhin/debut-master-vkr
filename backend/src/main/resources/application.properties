spring.application.name=vk-chess-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vk_chess}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vk_chess}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vk_chess}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false